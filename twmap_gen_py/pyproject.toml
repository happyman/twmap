[project]
name = "twmap-gen"
version = "0.1.0"
description = "Taiwan topographic map generator — stitch, crop, and export printable maps"
requires-python = ">=3.11"
dependencies = [
    "pyproj>=3.6",
    "rasterio>=1.3",
    "aiohttp>=3.9",
    "Pillow>=10.0",
    "numpy>=1.24",
    "gpxpy>=1.6",
    "cairosvg>=2.7",
    "img2pdf>=0.4",
    "pypdf>=3.17",
    "websockets>=12.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4",
]

[project.scripts]
mapgen = "mapgen.cli:main"
cmd_make2 = "mapgen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mapgen"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
